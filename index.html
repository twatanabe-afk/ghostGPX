    <title>GPS トラッカー & ゴーストランナー</title>
    <!-- Apple Touch Icon & Favicon -->
    <link rel="apple-touch-icon" id="apple-touch-icon" sizes="180x180" href="">
    <link rel="icon" type="image/png" id="app-favicon" href="">
    <script>
        (function() {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 180; canvas.height = 180;
                const ctx = canvas.getContext('2d');
                if (ctx) {
                    const grad = ctx.createLinearGradient(0, 0, 180, 180);
                    grad.addColorStop(0, '#10b981');
                    grad.addColorStop(1, '#047857');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, 180, 180);
                    ctx.save();
                    ctx.translate(90, 86); ctx.scale(4.2, 4.2); ctx.translate(-12, -12);
                    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.fillStyle = 'transparent';
                    const pinPath = new Path2D('M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z');
                    ctx.stroke(pinPath);
                    ctx.beginPath(); ctx.arc(12, 10, 3, 0, Math.PI * 2); ctx.stroke();
                    ctx.restore();
                    const iconData = canvas.toDataURL('image/png');
                    const appleIcon = document.getElementById('apple-touch-icon');
                    if (appleIcon) appleIcon.href = iconData;
                    const favicon = document.getElementById('app-favicon');
                    if (favicon) favicon.href = iconData;
                }
            } catch (e) { console.error("Failed to generate apple touch icon", e); }
        })();
    </script>

        body { font-family: 'Inter', sans-serif; }

        .leaflet-container { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        .leaflet-control-zoom {

            font-size: 22px !important; font-weight: 500 !important;

            transition: all 0.15s ease !important; display: flex !important; align-items: center !important; justify-content: center !important;
        }

        /* 現在地マーカー：赤点滅（記録中） / 青点滅（停止中） */
        .pulse-dot-red {
            background-color: #ef4444; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulse-red 1.6s infinite cubic-bezier(0.66, 0, 1);
        }
        @keyframes pulse-red { to { box-shadow: 0 0 0 13px rgba(239, 68, 68, 0); } }

        .pulse-dot-blue {
            background-color: #3b82f6; box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7);
            animation: pulse-blue 1.6s infinite cubic-bezier(0.66, 0, 1);
        }
        @keyframes pulse-blue { to { box-shadow: 0 0 0 13px rgba(59, 130, 246, 0); } }

        /* ゴーストマーカー：シアンパルスバブル */
        .pulse-dot-cyan {
            background-color: rgba(6, 182, 212, 0.95);
            border: 2px solid #ffffff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 16px;
            box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.8);
            animation: pulse-cyan 1.5s infinite cubic-bezier(0.66, 0, 1);
        }
        @keyframes pulse-cyan { to { box-shadow: 0 0 0 15px rgba(6, 182, 212, 0); } }

        .kml-point-label-base {
            padding: 2px 7px !important; border-radius: 6px !important; white-space: nowrap !important;
            font-weight: 600 !important; box-shadow: 0 3px 6px rgba(0,0,0,0.35) !important;
            pointer-events: none !important; transition: all 0.15s ease;
        }

        input[type=range] { accent-color: #06b6d4; }
