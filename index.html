<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GPS Tracker & Ghost Runner</title>

  <!-- iOS PWA 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GPS Ghost">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- toGeoJSON -->
  <script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>

  <style>
    html, body, #map {
      height: 100%;
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #111827;
    }

    /* マーカーアニメーション */
    @keyframes pulse-red-large {
      0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8); }
      70% { transform: scale(1.15); box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    @keyframes pulse-ghost-cyan {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.8); }
      70% { transform: scale(1.2); box-shadow: 0 0 0 22px rgba(6, 182, 212, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(6, 182, 212, 0); }
    }

    /* 現在地マーカー (赤) */
    .marker-current-large {
      width: 28px !important;
      height: 28px !important;
      background-color: #ef4444;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      animation: pulse-red-large 1.8s infinite;
    }

    /* ゴーストマーカー (シアンバブル) */
    .marker-ghost-large {
      width: 36px !important;
      height: 36px !important;
      background-color: rgba(6, 182, 212, 0.95);
      border: 3px solid #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(6, 182, 212, 0.6);
      animation: pulse-ghost-cyan 1.6s infinite;
    }
  </style>
</head>
<body class="bg-gray-900 flex flex-col h-screen antialiased select-none">

  <!-- マップ表示エリア -->
  <div id="map" class="z-0 h-full w-full"></div>

  <!-- 上部ステータス表示（VSモード時） -->
  <div id="ghost-status-card" class="hidden absolute top-4 left-1/2 transform -translate-x-1/2 z-20 w-11/12 max-w-md bg-gray-900/90 backdrop-blur-md text-white p-3 rounded-2xl shadow-2xl border border-gray-700">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="inline-block w-3 h-3 bg-cyan-400 rounded-full animate-ping"></span>
        <span class="text-xs font-bold uppercase tracking-wider text-cyan-400">VS GHOST</span>
      </div>
      <div id="ghost-diff-time" class="text-xl font-black font-mono tracking-tight text-yellow-400">
        --:--
      </div>
    </div>
    <div class="grid grid-cols-2 gap-2 mt-2 pt-2 border-t border-gray-700/60 text-xs">
      <div>
        <span class="text-gray-400">距離差:</span>
        <span id="ghost-diff-dist" class="font-bold ml-1 text-white">-- m</span>
      </div>
      <div class="text-right">
        <span class="text-gray-400">ゴースト速度:</span>
        <span id="ghost-speed" class="font-bold ml-1 text-white">-- km/h</span>
      </div>
    </div>
  </div>

  <!-- ゴースト位置調整・プレイヤーコントローラー (音楽プレイヤー風) -->
  <div id="ghost-player-card" class="hidden absolute bottom-28 left-1/2 transform -translate-x-1/2 z-20 w-11/12 max-w-md bg-gray-900/95 backdrop-blur-md text-white p-4 rounded-2xl shadow-2xl border border-gray-700">
    <div class="flex items-center justify-between mb-2">
      <!-- 再生コントロール -->
      <div class="flex items-center space-x-2">
        <button id="btn-player-reset" class="bg-gray-800 hover:bg-gray-700 text-gray-300 p-2 rounded-lg text-xs font-bold transition">
          ⏮️ 最初へ
        </button>
        <button id="btn-replay-play" class="bg-cyan-500 hover:bg-cyan-600 active:scale-95 text-white p-2 rounded-full w-9 h-9 flex items-center justify-center font-bold text-sm shadow-md transition">
          ▶
        </button>
        <button id="btn-skip-back" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-2 py-1 rounded text-xs">
          -5s
        </button>
        <button id="btn-skip-forward" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-2 py-1 rounded text-xs">
          +5s
        </button>
      </div>

      <!-- タイムカウンター -->
      <div class="text-xs font-mono">
        <span id="player-current-time" class="text-cyan-400 font-bold">00:00</span> / <span id="player-total-time" class="text-gray-400">00:00</span>
      </div>
    </div>

    <!-- 音楽プレイヤー風 シークバー -->
    <div class="space-y-1">
      <input id="ghost-seekbar" type="range" min="0" max="100" value="0" class="w-full h-2.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-cyan-400">
      <div class="flex justify-between text-[10px] text-gray-400 font-bold">
