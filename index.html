<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GPS Tracker & Ghost Runner</title>
<!-- iOS PWA メタタグ -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GPS Ghost">
<!-- Tailwind CSS CDN (互換性の高いPlay CDN) -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Leaflet.js CSS & JS (最も安定したunpkg CDN) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<!-- toGeoJSON -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/togeojson/0.16.0/togeojson.min.js"></script>
<style>
* {
box-sizing: border-box;
}
html, body {
height: 100%;
width: 100vw;
margin: 0;
padding: 0;
overflow: hidden;
background-color: #111827;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
/* マップのレイアウト固定設定 */
#map {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
background-color: #e5e7eb;
z-index: 0;
}
/* マーカーアニメーション */
@keyframes pulse-red-large {
0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8); }
70% { transform: scale(1.15); box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
}
@keyframes pulse-ghost-cyan {
0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.8); }
70% { transform: scale(1.2); box-shadow: 0 0 0 22px rgba(6, 182, 212, 0); }
100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(6, 182, 212, 0); }
}
.marker-current-large {
width: 28px !important;
height: 28px !important;
background-color: #ef4444;
border: 3px solid #ffffff;
border-radius: 50%;
box-shadow: 0 4px 10px rgba(0,0,0,0.4);
animation: pulse-red-large 1.8s infinite;
}
.marker-ghost-large {
width: 36px !important;
height: 36px !important;
background-color: rgba(6, 182, 212, 0.95);
border: 3px solid #ffffff;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-size: 18px;
box-shadow: 0 4px 12px rgba(6, 182, 212, 0.6);
animation: pulse-ghost-cyan 1.6s infinite;
}
</style>
</head>
<body class="bg-gray-900 flex flex-col h-full w-full antialiased select-none">
<!-- メインマップ -->
<div id="map"></div>
<!-- 上部VSモードステータス -->
<div id="ghost-status-card" class="hidden fixed top-4 left-1/2 transform -translate-x-1/2 z-30 w-11/12 max-w-md bg-gray-900/90 backdrop-blur-md text-white p-3 rounded-2xl shadow-2xl border border-gray-700">
<div class="flex items-center justify-between">
<div class="flex items-center space-x-2">
<span class="inline-block w-3 h-3 bg-cyan-400 rounded-full animate-ping"></span>
<span class="text-xs font-bold uppercase tracking-wider text-cyan-400">VS GHOST</span>
</div>
<div id="ghost-diff-time" class="text-xl font-black font-mono tracking-tight text-yellow-400">
--:--
</div>
</div>
<div class="grid grid-cols-2 gap-2 mt-2 pt-2 border-t border-gray-700/60 text-xs">
<div>
<span class="text-gray-400">距離差:</span>
<span id="ghost-diff-dist" class="font-bold ml-1 text-white">-- m</span>
</div>
<div class="text-right">
<span class="text-gray-400">ゴースト速度:</span>
<span id="ghost-speed" class="font-bold ml-1 text-white">-- km/h</span>
</div>
</div>
</div>
<!-- プレイヤーコントロールカード -->
<div id="ghost-player-card" class="hidden fixed bottom-28 left-1/2 transform -translate-x-1/2 z-30 w-11/12 max-w-md bg-gray-900/95 backdrop-blur-md text-white p-4 rounded-2xl shadow-2xl border border-gray-700">
<div class="flex items-center justify-between mb-2">
<div class="flex items-center space-x-2">
<button id="btn-player-reset" class="bg-gray-800 hover:bg-gray-700 active:scale-95 text-gray-300 p-2 rounded-lg text-xs font-bold transition">
⏮️ 最初へ
</button>
<button id="btn-replay-play" class="bg-cyan-500 hover:bg-cyan-600 active:scale-95 text-white p-2 rounded-full w-9 h-9 flex items-center justify-center font-bold text-sm shadow-md transition">
▶
</button>
<button id="btn-skip-back" class="bg-gray-800 hover:bg-gray-700 active:scale-95 text-gray-300 px-2 py-1 rounded text-xs">
-5s
</button>
<button id="btn-skip-forward" class="bg-gray-800 hover:bg-gray-700 active:scale-95 text-gray-300 px-2 py-1 rounded text-xs">
+5s
</button>
</div>
<div class="text-xs font-mono">
<span id="player-current-time" class="text-cyan-400 font-bold">00:00</span> / <span id="player-total-time" class="text-gray-400">00:00</span>
</div>
</div>
<div class="space-y-1">
<input id="ghost-seekbar" type="range" min="0" max="100" value="0" class="w-full h-2.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-cyan-400">
<div class="flex justify-between text-[10px] text-gray-400 font-bold">
<span>📍 スタート</span>
<span>ゴースト出発位置調整</span>
<span>🏁 ゴール</span>
</div>
</div>
</div>
<!-- メイン操作ドロワー -->
<div class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-30 w-11/12 max-w-md bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-4 border border-gray-100">
<div class="flex items-center justify-between mb-2 px-1">
<div class="flex items-center space-x-1.5">
<span class="text-base">👻</span>
<span class="font-black text-gray-800 text-xs tracking-wider uppercase">GPS Ghost Runner</span>
</div>
<span class="bg-gray-100 text-gray-600 text-[10px] font-mono px-2 py-0.5 rounded-full font-bold border border-gray-200">
v2026.10.08-06:40
</span>
</div>
<div class="flex items-center justify-between">
<button id="btn-toggle-tracking" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-xl shadow-md transition flex items-center justify-center space-x-2 active:scale-95">
<span id="recording-dot" class="w-3 h-3 rounded-full bg-white"></span>
<span id="btn-tracking-label" class="text-sm">記録開始</span>
</button>
<button id="btn-recenter" class="bg-gray-100 hover:bg-gray-200 active:scale-95 text-gray-700 p-3 rounded-xl shadow-sm transition ml-2 text-base">
🎯
</button>
<button id="btn-toggle-settings" class="bg-gray-100 hover:bg-gray-200 active:scale-95 text-gray-700 p-3 rounded-xl shadow-sm transition ml-2 text-base">
⚙️
</button>
</div>
<!-- 設定アコーディオン -->
<div id="settings-panel" class="hidden pt-3 mt-3 border-t border-gray-200 space-y-3 max-h-72 overflow-y-auto">
<div class="bg-cyan-50 p-3 rounded-xl border border-cyan-100">
<label class="block text-xs font-bold text-cyan-900 mb-1.5">👻 ゴーストGPXファイル選択</label>
<input type="file" id="input-ghost-file" accept=".gpx,text/xml" class="hidden">
<button id="btn-select-ghost" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white text-xs font-bold py-2.5 px-3 rounded-lg shadow-sm transition flex items-center justify-center space-x-1 mb-2">
📁 GPXファイルを開く
</button>
<div id="ghost-file-info" class="text-xs text-gray-600 mb-2 truncate hidden">
ファイル: <span id="ghost-filename" class="font-bold text-gray-800"></span>
</div>
<div class="grid grid-cols-2 gap-1 bg-gray-200 p-1 rounded-lg text-xs font-bold text-gray-600">
<button id="mode-vs" class="py-1.5 rounded-md bg-white text-cyan-700 shadow-sm text-center">
⚔️ VS並走
</button>
<button id="mode-replay" class="py-1.5 rounded-md text-center">
▶️ リプレイ
</button>
</div>
</div>
<div>
<label class="block text-xs font-bold text-gray-600 mb-1">🗺️ 地図の種類</label>
<select id="map-tile-select" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-xs rounded-lg p-2.5">
<option value="osm">OpenStreetMap (標準)</option>
<option value="gsi_std">国土地理院 (標準)</option>
<option value="gsi_pale">国土地理院 (淡色)</option>
</select>
</div>
</div>
</div>
<script>
let map, currentMarker, ghostMarker;
let trackPolyline, ghostPolyline;
let watchId = null, isTracking = false, autoRecenter = true;
let currentTrack = [], ghostData = null, ghostTotalDuration = 0;
let ghostMode = 'vs', replayTimer = null, ghostOffsetTime = 0, replaySpeed = 1, trackingStartTime = null;
const tileLayers = {
osm: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
attribution: '© OpenStreetMap contributors',
maxZoom: 19
}),
gsi_std: L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
attribution: '© 国土地理院',
maxZoom: 18
}),
gsi_pale: L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
attribution: '© 国土地理院',
maxZoom: 18
})
};
function initMap() {
if (typeof L === 'undefined') {
setTimeout(initMap, 200);
return;
}
try {
map = L.map('map', {
zoomControl: false,
fadeAnimation: false
}).setView([35.681236, 139.767125], 15);
tileLayers.osm.addTo(map);
currentMarker = L.marker([35.681236, 139.767125], {
icon: L.divIcon({ className: 'marker-current-large', iconSize: [28, 28], iconAnchor: [14, 14] })
}).addTo(map);
ghostMarker = L.marker([35.681236, 139.767125], {
icon: L.divIcon({ className: 'marker-ghost-large', html: '👻', iconSize: [36, 36], iconAnchor: [18, 18] })
});
trackPolyline = L.polyline([], { color: '#ef4444', weight: 5, opacity: 0.9 }).addTo(map);
ghostPolyline = L.polyline([], { color: '#06b6d4', weight: 4, opacity: 0.6, dashArray: '6, 8' }).addTo(map);
setupEvents();
setTimeout(() => { map.invalidateSize(); }, 500);
if (navigator.geolocation) {
navigator.geolocation.getCurrentPosition(
(pos) => {
const lat = pos.coords.latitude, lng = pos.coords.longitude;
map.setView([lat, lng], 16);
currentMarker.setLatLng([lat, lng]);
},
(err) => console.log("初期GPS失敗:", err),
{ enableHighAccuracy: false, timeout: 5000 }
);
}
} catch (err) {
console.error("Leaflet Error:", err);
}
}
if (document.readyState === 'complete' || document.readyState === 'interactive') {
initMap();
} else {
window.addEventListener('DOMContentLoaded', initMap);
}
function parseGhostGPX(xmlText) {
try {
const parser = new DOMParser();
const xmlDoc = parser.parseFromString(xmlText, "text/xml");
let pts = xmlDoc.querySelectorAll("trkpt");
if (pts.length === 0) pts = xmlDoc.querySelectorAll("rtept");
if (!pts || pts.length === 0) {
alert("GPX内に位置データが見つかりませんでした。");
return null;
}
let parsed = [], startTime = null;
pts.forEach((pt) => {
const lat = parseFloat(pt.getAttribute("lat"));
const lng = parseFloat(pt.getAttribute("lon"));
const timeNode = pt.querySelector("time");
if (!isNaN(lat) && !isNaN(lng)) {
let timeOffset = 0;
if (timeNode) {
const timeVal = new Date(timeNode.textContent).getTime();
if (!isNaN(timeVal)) {
if (startTime === null) startTime = timeVal;
timeOffset = (timeVal - startTime) / 1000;
}
}
parsed.push({ lat, lng, timeOffset });
}
});
if (parsed.length < 2) return null;
if (startTime === null || parsed[parsed.length - 1].timeOffset === 0) {
parsed.forEach((p, idx) => { p.timeOffset = idx * 2; });
}
ghostTotalDuration = parsed[parsed.length - 1].timeOffset;
return parsed;
} catch(e) {
alert("GPXファイルの解析に失敗しました。");
return null;
}
}
function getGhostStateAtTime(sec) {
if (!ghostData || ghostData.length === 0) return null;
if (sec <= 0) return { lat: ghostData[0].lat, lng: ghostData[0].lng, speed: 0 };
const last = ghostData[ghostData.length - 1];
if (sec >= last.timeOffset) return { lat: last.lat, lng: last.lng, speed: 0 };
for (let i = 0; i < ghostData.length - 1; i++) {
const p1 = ghostData[i], p2 = ghostData[i + 1];
if (sec >= p1.timeOffset && sec <= p2.timeOffset) {
const r = (sec - p1.timeOffset) / (p2.timeOffset - p1.timeOffset || 1);
const lat = p1.lat + (p2.lat - p1.lat) * r;
const lng = p1.lng + (p2.lng - p1.lng) * r;
const dist = calcDist(p1.lat, p1.lng, p2.lat, p2.lng);
const speed = (dist / ((p2.timeOffset - p1.timeOffset) || 1)) * 3.6;
return { lat, lng, speed };
}
}
return null;
}
function updateGhostPosition(sec) {
ghostOffsetTime = Math.max(0, Math.min(sec, ghostTotalDuration));
const gState = getGhostStateAtTime(ghostOffsetTime);
if (gState) {
ghostMarker.setLatLng([gState.lat, gState.lng]);
if (!map.hasLayer(ghostMarker)) ghostMarker.addTo(map);
}
document.getElementById('player-current-time').textContent = formatTime(ghostOffsetTime);
document.getElementById('ghost-seekbar').value = (ghostOffsetTime / ghostTotalDuration) * 100 || 0;
}
function toggleTracking() {
if (isTracking) {
navigator.geolocation.clearWatch(watchId);
isTracking = false;
document.getElementById('btn-tracking-label').textContent = '記録開始';
document.getElementById('recording-dot').className = 'w-3 h-3 rounded-full bg-white';
document.getElementById('ghost-status-card').classList.add('hidden');
} else {
if (!navigator.geolocation) return alert('GPSがサポートされていません。');
currentTrack = [];
trackPolyline.setLatLngs([]);
trackingStartTime = Date.now();
watchId = navigator.geolocation.watchPosition(
(pos) => {
const lat = pos.coords.latitude, lng = pos.coords.longitude;
currentMarker.setLatLng([lat, lng]);
if (!map.hasLayer(currentMarker)) currentMarker.addTo(map);
trackPolyline.addLatLng([lat, lng]);
if (autoRecenter) map.panTo([lat, lng]);
if (ghostData && ghostMode === 'vs') {
const elapsed = ((Date.now() - trackingStartTime) / 1000) + ghostOffsetTime;
const gState = getGhostStateAtTime(elapsed);
if (gState) {
ghostMarker.setLatLng([gState.lat, gState.lng]);
if (!map.hasLayer(ghostMarker)) ghostMarker.addTo(map);
const dist = calcDist(lat, lng, gState.lat, gState.lng);
document.getElementById('ghost-diff-time').textContent = formatTime(elapsed);
document.getElementById('ghost-diff-dist').textContent = ⁠${Math.round(dist)} m⁠;
document.getElementById('ghost-speed').textContent = ⁠${gState.speed.toFixed(1)} km/h⁠;
}
}
},
(err) => console.warn("GPSエラー:", err),
{ enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
);
isTracking = true;
document.getElementById('btn-tracking-label').textContent = '記録中...';
document.getElementById('recording-dot').className = 'w-3 h-3 rounded-full bg-red-200 animate-ping';
if (ghostData && ghostMode === 'vs') document.getElementById('ghost-status-card').classList.remove('hidden');
}
}
function startReplay() {
stopReplay();
if (!ghostData) return;
replayTimer = setInterval(() => {
ghostOffsetTime += 0.2 * replaySpeed;
if (ghostOffsetTime > ghostTotalDuration) { ghostOffsetTime = ghostTotalDuration; stopReplay(); }
updateGhostPosition(ghostOffsetTime);
}, 200);
}
function stopReplay() {
if (replayTimer) { clearInterval(replayTimer); replayTimer = null; }
document.getElementById('btn-replay-play').textContent = '▶';
}
function calcDist(lat1, lon1, lat2, lon2) {
const R = 6371e3;
const dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
const a = Math.sin(dLat/2)2 + Math.cos(lat1Math.PI/180) * Math.cos(lat2Math.PI/180) * Math.sin(dLon/2)2;
return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function formatTime(s) {
const m = Math.floor(s / 60), sec = Math.floor(s % 60);
return ⁠${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}⁠;
}
function setupEvents() {
document.getElementById('btn-toggle-tracking').addEventListener('click', toggleTracking);
document.getElementById('btn-recenter').addEventListener('click', () => {
autoRecenter = true;
if (currentMarker.getLatLng().lat !== 0) map.panTo(currentMarker.getLatLng());
});
document.getElementById('btn-toggle-settings').addEventListener('click', () => {
document.getElementById('settings-panel').classList.toggle('hidden');
});
document.getElementById('map-tile-select').addEventListener('change', (e) => {
Object.values(tileLayers).forEach(l => map.removeLayer(l));
tileLayers[e.target.value].addTo(map);
});
document.getElementById('btn-select-ghost').addEventListener('click', () => {
document.getElementById('input-ghost-file').click();
});
document.getElementById('input-ghost-file').addEventListener('change', (e) => {
const file = e.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = (evt) => {
const parsed = parseGhostGPX(evt.target.result);
if (parsed) {
ghostData = parsed;
const coords = ghostData.map(p => [p.lat, p.lng]);
ghostPolyline.setLatLngs(coords);
map.fitBounds(ghostPolyline.getBounds(), { padding: [40, 40] });
document.getElementById('ghost-filename').textContent = file.name;
document.getElementById('ghost-file-info').classList.remove('hidden');
document.getElementById('ghost-player-card').classList.remove('hidden');
document.getElementById('player-total-time').textContent = formatTime(ghostTotalDuration);
updateGhostPosition(0);
}
};
reader.readAsText(file);
});
document.getElementById('ghost-seekbar').addEventListener('input', (e) => {
if (!ghostTotalDuration) return;
const targetSec = (parseFloat(e.target.value) / 100) * ghostTotalDuration;
updateGhostPosition(targetSec);
});
document.getElementById('btn-player-reset').addEventListener('click', () => updateGhostPosition(0));
document.getElementById('btn-skip-back').addEventListener('click', () => updateGhostPosition(ghostOffsetTime - 5));
document.getElementById('btn-skip-forward').addEventListener('click', () => updateGhostPosition(ghostOffsetTime + 5));
document.getElementById('btn-replay-play').addEventListener('click', () => {
if (replayTimer) { stopReplay(); } else { document.getElementById('btn-replay-play').textContent = '⏸'; startReplay(); }
});
}
</script>
</body>
</html>
