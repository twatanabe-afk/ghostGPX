<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GPS Tracker & Ghost Runner</title>

  <!-- iOS PWA メタタグ -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GPS Ghost">

  <!-- Tailwind CSS CDN (jsDelivr) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Leaflet.js CSS & JS (cdnjs - 安定版) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <!-- toGeoJSON (cdnjs) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/togeojson/0.16.0/togeojson.min.js"></script>

  <style>
    /* iOS Safari向け高さ崩れ防止設定 */
    html, body {
      height: 100%;
      height: 100dvh;
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #map {
      height: 100%;
      height: 100dvh;
      width: 100vw;
      z-index: 1;
    }

    /* マーカーアニメーション */
    @keyframes pulse-red-large {
      0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8); }
      70% { transform: scale(1.15); box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    @keyframes pulse-ghost-cyan {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.8); }
      70% { transform: scale(1.2); box-shadow: 0 0 0 22px rgba(6, 182, 212, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(6, 182, 212, 0); }
    }

    .marker-current-large {
      width: 28px !important;
      height: 28px !important;
      background-color: #ef4444;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      animation: pulse-red-large 1.8s infinite;
    }

    .marker-ghost-large {
      width: 36px !important;
      height: 36px !important;
      background-color: rgba(6, 182, 212, 0.95);
      border: 3px solid #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(6, 182, 212, 0.6);
      animation: pulse-ghost-cyan 1.6s infinite;
    }
  </style>
</head>
<body class="bg-gray-900 flex flex-col h-full w-full antialiased select-none">

  <!-- メインマップ -->
  <div id="map"></div>

  <!-- 上部VSモードステータス -->
  <div id="ghost-status-card" class="hidden fixed top-4 left-1/2 transform -translate-x-1/2 z-30 w-11/12 max-w-md bg-gray-900/90 backdrop-blur-md text-white p-3 rounded-2xl shadow-2xl border border-gray-700">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="inline-block w-3 h-3 bg-cyan-400 rounded-full animate-ping"></span>
        <span class="text-xs font-bold uppercase tracking-wider text-cyan-400">VS GHOST</span>
      </div>
      <div id="ghost-diff-time" class="text-xl font-black font-mono tracking-tight text-yellow-400">
        --:--
      </div>
    </div>
    <div class="grid grid-cols-2 gap-2 mt-2 pt-2 border-t border-gray-700/60 text-xs">
      <div>
        <span class="text-gray-400">距離差:</span>
        <span id="ghost-diff-dist" class="font-bold ml-1 text-white">-- m</span>
      </div>
      <div class="text-right">
        <span class="text-gray-400">ゴースト速度:</span>
        <span id="ghost-speed" class="font-bold ml-1 text-white">-- km/h</span>
      </div>
    </div>
  </div>

  <!-- プレイヤーコントロールカード -->
  <div id="ghost-player-card" class="hidden fixed bottom-28 left-1/2 transform -translate-x-1/2 z-30 w-11/12 max-w-md bg-gray-900/95 backdrop-blur-md text-white p-4 rounded-2xl shadow-2xl border border-gray-700">
    <div class="flex items-center justify-between mb-2">
      <div class="flex items-center space-x-2">
        <button id="btn-player-reset" class="bg-gray-800 hover:bg-gray-700 active:scale-95 text-gray-300 p-2 rounded-lg text-xs font-bold transition">
          ⏮️ 最初へ
        </button>
        <button id="btn-replay-play" class="bg-cyan-500 hover:bg-cyan-600 active:scale-95 text-white p-2 rounded-full w-9 h-9 flex items-center justify-center font-bold text-sm shadow-md transition">
          ▶
        </button>
        <button id="btn-skip-back" class="bg-gray-800 hover:bg-gray-700 active:scale-95 text-gray-300 px-2 py-1 rounded text-xs">
          -5s
        </button>
        <button id="btn-skip-forward" class="bg-gray-800 hover:bg-gray-700 active:scale-95 text-gray-300 px-2 py-1 rounded text-xs">
          +5s
        </button>
      </div>
      <div class="text-xs font-mono">
        <span id="player-current-time" class="text-cyan-400 font-bold">00:00</span> / <span id="player-total-time" class="text-gray-400">00:00</span>
      </div>
    </div>

    <div class="space-y-1">
      <input id="ghost-seekbar" type="range" min="0" max="100" value="0" class="w-full h-2.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-cyan-400">
      <div class="flex justify-between text-[10px] text-gray-400 font-bold">
        <span>📍 スタート</span>
        <span>ゴースト出発位置調整</span>
        <span>🏁 ゴール</span>
      </div>
    </div>
  </div>

  <!-- メイン操作ドロワー -->
  <div class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-30 w-11/12 max-w-md bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-4 border border-gray-100">
    <div class="flex items-center justify-between mb-2 px-1">
      <div class="flex items-center space-x-1.5">
        <span class="text-base">👻</span>
        <span class="font-black text-gray-800 text-xs tracking-wider uppercase">GPS Ghost Runner</span>
      </div>
      <span class="bg-gray-100 text-gray-600 text-[10px] font-mono px-2 py-0.5 rounded-full font-bold border border-gray-200">
        v1.2.2-stable
      </span>
    </div>

    <div class="flex items-center justify-between">
      <button id="btn-toggle-tracking" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-xl shadow-md transition flex items-center justify-center space-x-2 active:scale-95">
        <span id="recording-dot" class="w-3 h-3 rounded-full bg-white"></span>
        <span id="btn-tracking-label" class="text-sm">記録開始</span>
      </button>

      <button id="btn-recenter" class="bg-gray-100 hover:bg-gray-200 active:scale-95 text-gray-700 p-3 rounded-xl shadow-sm transition ml-2 text-base">
        🎯
      </button>

      <button id="btn-toggle-settings" class="bg-gray-100 hover:bg-gray-200 active:scale-95 text-gray-700 p-3 rounded-xl shadow-sm transition ml-2 text-base">
        ⚙️
      </button>
    </div>

    <!-- 設定アコーディオン -->
    <div id="settings-panel" class="hidden pt-3 mt-3 border-t border-gray-200 space-y-3 max-h-72 overflow-y-auto">
      <div class="bg-cyan-50 p-3 rounded-xl border border-cyan-100">
        <label class="block text-xs font-bold text-cyan-900 mb-1.5">👻 ゴーストGPXファイル選択</label>
        
        <input type="file" id="input-ghost-file" accept=".gpx,text/xml" class="hidden">
        <button id="btn-select-ghost" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white text-xs font-bold py-2.5 px-3 rounded-lg shadow-sm transition flex items-center justify-center space-x-1 mb-2">
          📁 GPXファイルを開く
        </button>

        <div id="ghost-file-info" class="text-xs text-gray-600 mb-2 truncate hidden">
          ファイル: <span id="ghost-filename" class="font-bold text-gray-800"></span>
        </div>

        <div class="
